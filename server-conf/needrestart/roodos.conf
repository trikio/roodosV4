# Installed as /etc/needrestart/conf.d/roodos.conf.
# Library upgrades from unattended-upgrades must not restart Manticore on their own: a restart
# at 07:01 hung searchd and took the site down (outage of 2026-10-28). Restart it by hand.
$nrconf{override_rc}{qr(^manticore)} = 0;
$nrconf{override_rc}{qr(^searchd)} = 0;
