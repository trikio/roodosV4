on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:

  tests:
    name: tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: run tests
        run: |
          touch .env
          php artisan test

  run_pull:
    name: run pull
    needs: tests
    runs-on: ubuntu-latest

    steps:

      - name: executing remote ssh commands using ssh key
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            cd /app/

            sudo git fetch origin main
            sudo git reset --hard origin/main
            sudo git clean -fd


            sudo cp ./server-conf/nginx/nginx.conf /etc/nginx/nginx.conf
            sudo cp ./server-conf/nginx/default_swoole /etc/nginx/sites-available/default
            sudo cp ./server-conf/manticoresearch/stop_words_es.txt /etc/manticoresearch/stop_words_es.txt
            sudo cp ./server-conf/service_systemd/octane.service /etc/systemd/system/octane.service


            # Los secretos se escriben directo en el destino para no modificar archivos versionados.
            DB_PASS_ESCAPED=$(printf '%s' '${{ secrets.DB_PASS }}' | sed 's/[\\/&|]/\\&/g')
            sed "s|DB_PASSWORD|$DB_PASS_ESCAPED|g" ./server-conf/manticoresearch/manticore.conf | sudo tee /etc/manticoresearch/manticore.conf >/dev/null

            APP_KEY_ESCAPED=$(printf '%s' "${{ secrets.APP_ROODOS_KEY }}" | sed 's/[\\/&|]/\\&/g')
            sed "s|APP_ROODOS_KEY|$APP_KEY_ESCAPED|g" ./server-conf/_env_production | sudo tee /app/.env >/dev/null


            sudo crontab ./server-conf/cron/crontab
            sudo /etc/init.d/cron start

            # if command -v indexer >/dev/null 2>&1; then
            #   sudo indexer --all --rotate || true
            # fi

            if [ -f composer.json ]; then
              sudo composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
            fi

            sudo npm ci
            sudo npm run build

            sudo php8.4 artisan config:cache
            sudo php8.4 artisan route:cache
            sudo php8.4 artisan view:cache

            # Migración única desde el arranque con nohup: detener la instancia suelta si existe.
            if ! sudo systemctl is-active --quiet octane; then
              sudo php8.4 artisan octane:stop --server=swoole || true
            fi

            sudo systemctl daemon-reload
            sudo systemctl enable octane
            sudo systemctl restart octane

            sudo service nginx restart

            exit
